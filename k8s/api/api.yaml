apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-api-config
  namespace: aegis-system
data:
  DATABASE_URL: "postgresql+asyncpg://aegis_admin:aegis_secure_password@aegis-postgres:5432/aegis_fraud_db"
  KAFKA_BOOTSTRAP_SERVERS: "aegis-kafka:9092"
  SCORING_SERVICE_URL: "http://aegis-scoring:8001/predict"
  CORS_ORIGINS: "*"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-api
  namespace: aegis-system
  labels:
    app: aegis-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-api
  template:
    metadata:
      labels:
        app: aegis-api
    spec:
      containers:
        - name: api
          image: aegis-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aegis-api-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-api
  namespace: aegis-system
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: aegis-api
