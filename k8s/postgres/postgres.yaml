apiVersion: v1
kind: Secret
metadata:
  name: aegis-postgres-secret
  namespace: aegis-system
type: Opaque
stringData:
  POSTGRES_USER: aegis_admin
  POSTGRES_PASSWORD: aegis_secure_password
  POSTGRES_DB: aegis_fraud_db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aegis-postgres-pvc
  namespace: aegis-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-postgres
  namespace: aegis-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-postgres
  template:
    metadata:
      labels:
        app: aegis-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: aegis-postgres-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: aegis-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-postgres
  namespace: aegis-system
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: aegis-postgres
