apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aegis-kafka
  namespace: aegis-system
spec:
  serviceName: aegis-kafka
  replicas: 1
  selector:
    matchLabels:
      app: aegis-kafka
  template:
    metadata:
      labels:
        app: aegis-kafka
    spec:
      containers:
        - name: kafka
          image: bashj79/kafka-kraft:latest
          ports:
            - containerPort: 9092
              name: client
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://aegis-kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@aegis-kafka:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-kafka
  namespace: aegis-system
spec:
  ports:
    - port: 9092
      name: client
    - port: 9093
      name: controller
  selector:
    app: aegis-kafka
