apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-scoring
  namespace: aegis-system
  labels:
    app: aegis-scoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-scoring
  template:
    metadata:
      labels:
        app: aegis-scoring
    spec:
      containers:
        - name: scoring
          image: aegis-scoring:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: FRAUD_THRESHOLD
              value: "0.70"
            - name: MEDIUM_RISK_THRESHOLD
              value: "0.40"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-scoring
  namespace: aegis-system
spec:
  ports:
    - port: 8001
      targetPort: 8001
  selector:
    app: aegis-scoring
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-scoring-hpa
  namespace: aegis-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegis-scoring
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
