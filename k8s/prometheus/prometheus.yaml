apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-prometheus-config
  namespace: aegis-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: "aegis-api"
        static_configs:
          - targets: ["aegis-api:8000"]
      - job_name: "aegis-scoring"
        static_configs:
          - targets: ["aegis-scoring:8001"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-prometheus
  namespace: aegis-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-prometheus
  template:
    metadata:
      labels:
        app: aegis-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: aegis-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-prometheus
  namespace: aegis-system
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: aegis-prometheus
