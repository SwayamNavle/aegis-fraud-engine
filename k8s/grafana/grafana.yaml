apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-grafana
  namespace: aegis-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-grafana
  template:
    metadata:
      labels:
        app: aegis-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-grafana
  namespace: aegis-system
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: aegis-grafana
