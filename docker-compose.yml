version: "3.8"

networks:
  aegis-net:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  spark_checkpoints:
  prometheus_data:
  grafana_data:

services:
  # ----------------------------------------------------------------------------
  # 1. KAFKA BROKER (Apache Kafka in KRaft Mode - No Zookeeper Needed)
  # ----------------------------------------------------------------------------
  kafka:
    image: bashj79/kafka-kraft:latest
    container_name: aegis-kafka
    networks:
      - aegis-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. POSTGRESQL (ACID Persistence & Unique Transaction Idempotency)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    networks:
      - aegis-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_fraud_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegis_fraud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. REDIS (Hot Feature Cache & Deduplication)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    networks:
      - aegis-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. XGBOOST FRAUD SCORING MICROSERVICE
  # ----------------------------------------------------------------------------
  scoring:
    build:
      context: .
      dockerfile: services/scoring/Dockerfile
    container_name: aegis-scoring
    networks:
      - aegis-net
    ports:
      - "8001:8001"
    environment:
      MODEL_PATH: ml/models/xgb_fraud_model.json
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-0.70}
      MEDIUM_RISK_THRESHOLD: ${MEDIUM_RISK_THRESHOLD:-0.40}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 5. CORE FASTAPI GATEWAY & WEBSOCKET ENGINE
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: aegis-api
    networks:
      - aegis-net
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aegis_admin}:${POSTGRES_PASSWORD:-aegis_secure_password}@postgres:5432/${POSTGRES_DB:-aegis_fraud_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCORING_SERVICE_URL: http://scoring:8001/predict
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      scoring:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 6. PYSPARK STRUCTURED STREAMING ENGINE
  # ----------------------------------------------------------------------------
  spark:
    build:
      context: .
      dockerfile: streaming/spark/Dockerfile
    container_name: aegis-spark
    networks:
      - aegis-net
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCORING_SERVICE_URL: http://scoring:8001/predict
      SPARK_CHECKPOINT_DIR: /tmp/checkpoints
    volumes:
      - spark_checkpoints:/tmp/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      scoring:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 7. HIGH-THROUGHPUT SYNTHETIC PRODUCER
  # ----------------------------------------------------------------------------
  producer:
    build:
      context: .
      dockerfile: streaming/producer/Dockerfile
    container_name: aegis-producer
    networks:
      - aegis-net
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RATE: 250
      FRAUD_RATIO: 0.018
    depends_on:
      kafka:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 8. REACT COMMAND CENTER FRONTEND
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    networks:
      - aegis-net
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 9. PROMETHEUS METRICS AGGREGATOR
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: aegis-prometheus
    networks:
      - aegis-net
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  # ----------------------------------------------------------------------------
  # 10. GRAFANA OBSERVABILITY DASHBOARD
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: aegis-grafana
    networks:
      - aegis-net
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
